name: Poka-Yoke CI Security Gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

# Minimal default permissions.
permissions:
  contents: read

# Prevent multiple builds of the same PR/branch from racing.
concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------
  # 1. Formatting gate
  # ---------------------------------------------------------
  format-gate:
    name: Formatting Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatter
        run: |
          python -m pip install --upgrade pip
          pip install black

      # --check deliberately does NOT modify source.
      # Any formatting discrepancy returns a non-zero exit code.
      - name: Check formatting
        run: |
          black --check --diff .

  # ---------------------------------------------------------
  # 2. Hardcoded-secret gate
  # ---------------------------------------------------------
  secret-gate:
    name: Hardcoded Secret Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks exits non-zero when a secret is detected.
      # No continue-on-error means the job becomes FAILED.
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------
  # 3. Static/security analysis
  # ---------------------------------------------------------
  security-gate:
    name: Security Analysis Gate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security scanner
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      # -ll causes Bandit to fail on sufficiently serious findings.
      - name: Run Bandit
        run: |
          bandit -r . -ll -ii

  # ---------------------------------------------------------
  # 4. Quarantine / stop gate
  # ---------------------------------------------------------
  quarantine:
    name: Quarantine Failed Build
    runs-on: ubuntu-latest

    needs:
      - format-gate
      - secret-gate
      - security-gate

    # Executes ONLY when one of the mandatory gates fails.
    if: ${{ always() && (
      needs.format-gate.result == 'failure' ||
      needs.secret-gate.result == 'failure' ||
      needs.security-gate.result == 'failure'
      ) }}

    steps:
      - name: Mark build as quarantined
        run: |
          echo "::error::Poka-Yoke gate failed."
          echo "::error::Build is QUARANTINED and must not be deployed."
          exit 1

  # ---------------------------------------------------------
  # 5. Deployment is impossible unless every gate passes
  # ---------------------------------------------------------
  deploy:
    name: Deploy Approved Build
    runs-on: ubuntu-latest

    needs:
      - format-gate
      - secret-gate
      - security-gate

    # Explicit all-success condition.
    if: >-
      ${{
        needs.format-gate.result == 'success' &&
        needs.secret-gate.result == 'success' &&
        needs.security-gate.result == 'success'
      }}

    steps:
      - name: Build
        run: |
          echo "All Poka-Yoke gates passed."
          echo "Proceeding with build/deployment."

      # Replace this with the organization's actual
      # build/package/deployment commands.
      - name: Deploy
        run: |
          echo "DEPLOYMENT ALLOWED"
